    role: expert
    domain: math
    base_model: meta-llama/Llama-2-7b-hf
    prompt_format:
      math: |
        Below is an instruction that describes a task. Write a response that appropriately completes the request.

        ### Instruction:
        {question}

        ### Response: Let's think step by step.
    prompt_source: "Official WizardLM/WizardMath repo (gsm8k_eval.py) & sst_v2/v5/scripts/eval_math_alpaca_cot.py L48-55"
    extractor:
      math: math_unified_v1
    generation:
      math:
        temperature: 0.0
        max_new_tokens: 512
        stop: ["</s>", "### Instruction:", "Question:", "\n\n\n"]
        n_samples: 320
        full_n: 1319
        log_samples: true
    official_value:
      gsm8k: {score: 54.9, source: "WizardMath paper (arXiv:2308.09583) Table 1; verified 55.62% on 320 samples (diff +0.72pt <= 5pt)"}

  vanillaOVO/WizardCoder-Python-7B-V1.0:
