# SafeMergeBench Single-Expert Evaluation Specification (Implementation Spec v2, Section 2.1)
# Principle: Merged models may ONLY be evaluated with settings verified & locked on single experts.

schema_version: 2

extractors:
  math_unified_v1:
    description: "Unified math answer extractor: (1) \\boxed{...}, (2) 'The (final) answer is ...', (3) #### <num>, (4) last numeric token."
    order:
      - "boxed"
      - "the_answer_is"
      - "hash_four"
      - "last_number"
    numeric_only: true

  code_bigcode_v1:
    description: "bigcode-evaluation-harness / EvalPlus standard Python code extraction and unit-test execution."
    numeric_only: false

  mcqa_option_v1:
    description: "Multiple-choice option extractor (A/B/C/D) for MedQA / PubMedQA."
    numeric_only: false

models:
  # ============================================================================
  # Standard Track: Llama-3.1-8B-Instruct (MergeBench, NeurIPS 2025)
  # ============================================================================
  meta-llama/Llama-3.1-8B-Instruct:
    track: standard
    role: base
    domain: base
    prompt_format:
      safety: "hf (tokenizer.apply_chat_template with Llama-3.1 official system prompt)"
      math: "lm-eval gsm8k_cot (8-shot CoT, no chat template override; --log_samples required)"
      coding: "bigcode-evaluation-harness humanevalplus,mbppplus (base completion prompt)"
    prompt_source: "Meta Llama-3.1-8B-Instruct model card & MergeBench/scripts/evaluate.sh (dedf1b1)"
    extractor:
      math: math_unified_v1
      coding: code_bigcode_v1
    generation:
      math: {temperature: 0.0, max_new_tokens: 512, n_samples: 1319, log_samples: true}
      coding: {temperature: 0.2, max_length_generation: 512, n_samples_per_task: 10}
      safety: {temperature: 0.0, max_new_tokens: 512, template: "hf"}
    official_value:
      gsm8k_cot: {score: null, source: "Reference base; measured 77.41% (2026-11-26)"}
      humanevalplus: {score: null, source: "Reference base; measured 59.88% pass@1 (2026-11-26)"}
      mbppplus: {score: null, source: "Reference base; measured 58.28% pass@1 (2026-11-26)"}

  MergeBench/Llama-3.1-8B-Instruct_safety:
    track: standard
    role: expert
    domain: safety
    base_model: meta-llama/Llama-3.1-8B-Instruct
    prompt_format:
