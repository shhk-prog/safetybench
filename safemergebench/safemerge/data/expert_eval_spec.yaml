  # ============================================================================
  # Real-World Track: Llama-2-7B + WizardMath / WizardCoder / MedAlpaca (sst_v2)
  # ============================================================================
  meta-llama/Llama-2-7b-hf:
    track: realworld
    role: base
    domain: base
    prompt_format:
      math: "Below is an instruction that describes a task. Write a response that appropriately completes the request.\n\n### Instruction:\n{question}\n\n### Response: Let's think step by step."
      coding: "plain / HumanEval completion"
      medical: "Context: {context}\nQuestion: {question}\nAnswer:"
    prompt_source: "Meta Llama-2-7b-hf pretrained base (no chat template)"
    extractor:
      math: math_unified_v1
      coding: code_bigcode_v1
      medical: mcqa_option_v1
    generation:
      math: {temperature: 0.0, max_new_tokens: 512, n_samples: 320, full_n: 1319, log_samples: true}
    official_value:
      gsm8k: {score: null, source: "Reference base (measured 1.88% under Alpaca-CoT zero-shot)"}

  WizardLMTeam/WizardMath-7B-V1.0:
