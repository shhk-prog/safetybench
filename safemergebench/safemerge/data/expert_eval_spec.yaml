      math: "lm-eval gsm8k_cot (--log_samples required)"
      coding: "bigcode-evaluation-harness humanevalplus,mbppplus"
    prompt_source: "MergeBench HF model card & MergeBench/scripts/evaluate.sh (dedf1b1)"
    extractor:
      math: math_unified_v1
      coding: code_bigcode_v1
    generation:
      math: {temperature: 0.0, max_new_tokens: 512, n_samples: 1319, log_samples: true}
      coding: {temperature: 0.2, max_length_generation: 512, n_samples_per_task: 10}
      safety: {temperature: 0.0, max_new_tokens: 512, template: "hf"}
    official_value:
      gsm8k_cot: {score: null, source: "Not tabulated in arXiv:2505.10833; check VRR>=0.95 and safety improvement vs base"}

  MergeBench/Llama-3.1-8B-Instruct_math:
