    official_value:
      gsm8k_cot: {score: null, source: "Not tabulated raw in arXiv:2505.10833 (Table 17 merged Math avg 52.3-68.2%). Gate uses >= base (77.41%); measured 82.94% with math_unified_v1 vs 5.23% lm-eval '$.' bug."}

